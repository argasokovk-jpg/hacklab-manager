<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд — HackLab Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: var(--blue);
        }
        .stat-card .label {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }
        .stat-card .level-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .level-beginner { background: #445566; color: #fff; }
        .level-junior { background: #5b8cff; color: #fff; }
        .level-middle { background: #8b5cf6; color: #fff; }
        .level-senior { background: #65e6a3; color: #0a0e14; }

        .skills-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .skills-section h3 {
            margin-bottom: 16px;
            color: var(--text);
        }
        .skill-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .skill-item .name {
            width: 80px;
            font-size: 14px;
            color: var(--muted);
        }
        .skill-item .bar {
            flex: 1;
            height: 6px;
            background: #1a2a3a;
            border-radius: 10px;
            overflow: hidden;
        }
        .skill-item .bar .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }
        .skill-item .score {
            width: 50px;
            font-size: 14px;
            color: var(--text);
            text-align: right;
        }

        .recent-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .recent-section h3 {
            margin-bottom: 16px;
            color: var(--text);
        }
        .recent-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .recent-item:last-child { border-bottom: none; }
        .recent-item .lab { color: var(--text); }
        .recent-item .score { color: var(--blue); font-weight: 600; }
        .recent-item .time { color: var(--muted); font-size: 12px; }

        .labs-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .lab-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            transition: 0.3s;
        }
        .lab-item:hover { border-color: var(--blue); }
        .lab-item .info .name { font-weight: 600; }
        .lab-item .info .status {
            font-size: 12px;
            color: var(--muted);
        }
        .lab-item .info .status .done { color: #65e6a3; }
        .lab-item .info .status .locked { color: #ff4444; }
        .lab-item .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lab-item .right .score {
            font-size: 20px;
            font-weight: 700;
            color: var(--blue);
            min-width: 50px;
            text-align: right;
        }
        .lab-item .right .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            font-size: 13px;
        }
        .btn-start {
            background: var(--blue);
            color: #fff;
        }
        .btn-start:hover { background: #4a7ae0; }
        .btn-result {
            background: transparent;
            border: 1px solid var(--blue);
            color: var(--blue);
        }
        .btn-result:hover { background: var(--blue); color: #fff; }
        .btn-premium {
            background: transparent;
            border: 1px solid var(--purple);
            color: var(--purple);
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .dashboard-stats { grid-template-columns: repeat(2, 1fr); }
            .lab-item { flex-direction: column; align-items: stretch; gap: 12px; }
            .lab-item .right { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="background-grid"></div>

    <div class="navbar">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            HackLab
        </div>
        <nav>
            <a href="#" class="active">Дашборд</a>
            <a href="/static/lab.html?id=1">Lab 1</a>
            <a href="/static/profile.html">Профиль</a>
        </nav>
        <div class="nav-actions">
            <button onclick="logout()" class="login-btn" style="background:transparent;border:1px solid #ff4444;color:#ff4444;padding:6px 16px;border-radius:6px;cursor:pointer;">Выйти</button>
        </div>
    </div>

    <section class="section" style="padding-top:40px;">
        <div class="welcome" style="margin-bottom:24px;">
            <h1 style="font-size:28px;">Добро пожаловать, <span id="username" style="color:var(--blue);">Студент</span> 👋</h1>
            <p style="color:var(--muted);">Продолжай свою кибер-безопасную практику</p>
        </div>

        <div class="dashboard-stats" id="stats">
            <div class="stat-card">
                <div class="number" id="overallScore">0%</div>
                <div class="label">Общий прогресс</div>
            </div>
            <div class="stat-card">
                <div class="number" id="labsCompleted">0/0</div>
                <div class="label">Пройдено лабораторий</div>
            </div>
            <div class="stat-card">
                <div class="number" id="avgScore">0</div>
                <div class="label">Средний балл</div>
            </div>
            <div class="stat-card">
                <div class="number" id="levelDisplay">—</div>
                <div class="label">Уровень</div>
            </div>
        </div>

        <div class="skills-section">
            <h3>📊 Прогресс по навыкам</h3>
            <div id="skillsContainer">
                <div style="color:var(--muted);text-align:center;padding:20px;">Загрузка...</div>
            </div>
        </div>

        <div class="recent-section">
            <h3>📋 Последние результаты</h3>
            <div id="recentContainer">
                <div style="color:var(--muted);text-align:center;padding:20px;">Нет результатов</div>
            </div>
        </div>

        <h3 style="margin-bottom:16px;color:var(--text);font-size:20px;">📚 Лаборатории</h3>
        <div class="labs-list" id="labsContainer">
            <div style="color:var(--muted);text-align:center;padding:20px;">Загрузка...</div>
        </div>
    </section>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/static/login.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/static/login.html';
        }

        function startLab(id) {
            window.location.href = `/static/lab.html?id=${id}`;
        }

        function viewResult(id) {
            window.location.href = `/static/result.html?id=${id}`;
        }

        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        function renderDashboard(data) {
            const { labs, stats, skills, recent } = data;

            document.getElementById('overallScore').textContent = stats.overall + '%';
            document.getElementById('labsCompleted').textContent = `${stats.completed}/${stats.total}`;
            document.getElementById('avgScore').textContent = stats.avg_score;
            
            const levelEl = document.getElementById('levelDisplay');
            const level = stats.level || 'Beginner';
            levelEl.textContent = level;
            levelEl.className = `level-badge level-${level.toLowerCase()}`;

            const skillsContainer = document.getElementById('skillsContainer');
            if (Object.keys(skills).length === 0) {
                skillsContainer.innerHTML = '<div style="color:var(--muted);text-align:center;padding:10px;">Нет данных по навыкам</div>';
            } else {
                skillsContainer.innerHTML = Object.entries(skills).map(([name, score]) => `
                    <div class="skill-item">
                        <span class="name">${name.charAt(0).toUpperCase() + name.slice(1)}</span>
                        <div class="bar"><div class="fill" style="width:${score}%;"></div></div>
                        <span class="score">${score}%</span>
                    </div>
                `).join('');
            }

            const recentContainer = document.getElementById('recentContainer');
            if (recent.length === 0) {
                recentContainer.innerHTML = '<div style="color:var(--muted);text-align:center;padding:10px;">Нет результатов</div>';
            } else {
                recentContainer.innerHTML = recent.map(r => `
                    <div class="recent-item">
                        <span class="lab">Lab ${r.lab_id}</span>
                        <span class="score">${r.score}/100</span>
                        <span class="time">${new Date(r.created_at).toLocaleDateString('ru-RU')}</span>
                    </div>
                `).join('');
            }

            const labsContainer = document.getElementById('labsContainer');
            labsContainer.innerHTML = labs.map(lab => {
                const isCompleted = lab.completed;
                const isPremium = lab.premium || false;
                const score = lab.score;

                let statusHtml = '';
                let rightHtml = '';

                if (isPremium) {
                    statusHtml = '<span class="locked">🔒 Premium</span>';
                    rightHtml = `
                        <div class="score"><span style="color:var(--muted);">—</span></div>
                        <button class="btn btn-premium" disabled>🔒</button>
                    `;
                } else if (isCompleted) {
                    statusHtml = '<span class="done">✅ Пройдена</span>';
                    rightHtml = `
                        <div class="score">${score}/100</div>
                        <button class="btn btn-result" onclick="viewResult(${lab.id})">Результат</button>
                        <button class="btn btn-start" onclick="startLab(${lab.id})">Повторить</button>
                    `;
                } else {
                    statusHtml = '● Доступна';
                    rightHtml = `
                        <div class="score"><span style="color:var(--muted);">—</span></div>
                        <button class="btn btn-start" onclick="startLab(${lab.id})">Старт</button>
                    `;
                }

                return `
                    <div class="lab-item">
                        <div class="info">
                            <div class="name">${lab.name}</div>
                            <div class="status">${statusHtml}</div>
                        </div>
                        <div class="right">${rightHtml}</div>
                    </div>
                `;
            }).join('');

            fetch('/api/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(user => {
                document.getElementById('username').textContent = user.username || 'Студент';
            })
            .catch(() => {});
        }

        loadDashboard();
    </script>
</body>
</html>
