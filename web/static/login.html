<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — HackLab Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e14;
            color: #c8d6e5;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid #1a2a3a;
            border-radius: 16px;
            background: #111820;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 200, 200, 0.05);
        }
        h1 { color: #00e5ff; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #8899aa; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 14px;
            background: #1a2533;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            color: #c8d6e5;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #00e5ff; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #0a0e14;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { background: #00c8e0; }
        .link { margin-top: 20px; color: #8899aa; font-size: 14px; }
        .link a { color: #00e5ff; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .status { margin-top: 20px; font-size: 14px; color: #445566; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Вход</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="student@example.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <div class="link">
            Нет аккаунта? <a href="/static/register.html">Зарегистрироваться</a>
        </div>
        <div class="status" id="status">● Сервер работает</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');

            status.textContent = '⏳ Вход...';
            status.style.color = '#ffaa00';

            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch('/token', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    status.textContent = '✅ Успешно! Перенаправление...';
                    status.style.color = '#00e5ff';
                    setTimeout(() => { window.location.href = '/static/dashboard.html'; }, 1000);
                } else {
                    status.textContent = '❌ ' + (data.detail || 'Ошибка входа');
                    status.style.color = '#ff4444';
                }
            } catch (error) {
                status.textContent = '❌ Ошибка соединения с сервером';
                status.style.color = '#ff4444';
                console.error(error);
            }
        });
    </script>
</body>
</html>
